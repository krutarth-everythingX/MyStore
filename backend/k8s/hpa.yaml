apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mystore-app
  namespace: mystore
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mystore-app
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mystore-queue
  namespace: mystore
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mystore-queue
  minReplicas: 2
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

apiVersion: apps/v1
kind: Deployment
metadata:
  name: mystore-queue
  namespace: mystore
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mystore-queue
  template:
    metadata:
      labels:
        app: mystore-queue
    spec:
      containers:
        - name: worker
          image: ghcr.io/your-org/mystore-backend:latest
          command: ["php", "artisan", "queue:work", "redis", "--sleep=1", "--tries=3", "--timeout=90"]
          envFrom:
            - configMapRef:
                name: mystore-config
            - secretRef:
                name: mystore-secrets
          resources:
            requests:
              cpu: 150m
              memory: 192Mi
            limits:
              cpu: 750m
              memory: 512Mi
